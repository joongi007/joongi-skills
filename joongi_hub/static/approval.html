<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>호출 승인 · Joongi Hub</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/approval.css"><script src="/approval.js" defer></script></head>
<body><main class="approval-card"><p class="eyebrow">Joongi Hub · 한 번의 호출 승인</p><h1 id="title">이 요청을 허용할까요?</h1><p>에이전트가 연결된 서비스에 아래 요청을 보내려고 합니다. 실행 결과는 에이전트에 전달됩니다.</p><p id="status" class="notice" role="status" aria-live="polite">요청을 확인하고 있습니다.</p><section id="review" hidden><dl><dt>프로젝트 범위</dt><dd id="profile"></dd><dt>MCP 서버</dt><dd id="server"></dd><dt>연결 주소</dt><dd id="endpoint"></dd><dt>도구</dt><dd id="tool"></dd><dt>승인 유효 시간</dt><dd id="expiry"></dd></dl><h2>요청 인수</h2><pre id="arguments" tabindex="0" aria-label="요청 인수"></pre><details id="extra" hidden><summary>후속 요청 정보</summary><pre id="continuation"></pre></details><p class="muted">1시간·항상 허용은 이 범위와 연결의 같은 도구에 다른 인수나 페이지를 넣는 호출에도 적용됩니다. 연결·도구·로그인이 바뀌면 다시 확인합니다. 창을 닫아도 승인되지 않습니다.</p><label for="scope">허용 범위</label><select id="scope"><option value="once">이번 호출만</option><option value="hour">이 도구 1시간 허용</option><option value="always">이 도구 항상 허용</option></select><p id="scope-note" class="muted">현재 도구와 인수 조합에 한 번 적용합니다.</p><label class="approval-choice"><input id="auto-close" type="checkbox" checked> 완료 후 창 자동 닫기</label><div id="actions"><button id="deny" type="button">거절</button><button id="approve" class="primary" type="button">이 호출 한 번 승인</button></div><button id="retry-status" type="button" hidden>승인 상태 다시 확인</button><p id="close-status" class="muted" role="status" hidden></p><button id="keep-open" type="button" hidden>이 창 유지</button></section></main></body></html>
